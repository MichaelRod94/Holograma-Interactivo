<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Holograma3D · Display</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="view" aria-label="Holograma de 4 lados"></canvas>

  <main id="start" class="overlay">
    <h1>Holograma3D</h1>
    <form id="join" novalidate>
      <div id="code-field">
        <label for="code">Código de la sesión</label>
        <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
      </div>
      <div class="modes" role="group" aria-label="Vista">
        <button type="button" data-mode="hologram">Holograma 4 lados</button>
        <button type="button" data-mode="flat">Plana</button>
      </div>
      <p id="message" role="alert"></p>
      <button type="submit">Iniciar</button>
    </form>
    <p class="hint">En marcha: un toque muestra el botón para cambiar de vista, toque largo vuelve aquí, tres toques calibran.</p>
  </main>

  <button id="mode-quick" type="button" hidden></button>

  <div id="hud" hidden><span id="dot" class="dot"></span><span id="gesture">idle</span></div>
  <section id="calibration" class="panel" hidden aria-label="Calibración"></section>
  <p id="notice" role="status" hidden></p>
</body>
</html>
